name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite (stdlib unittest)
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the guard on the demo fixture (expect exit 1 = overlap found)
        run: |
          python guard.py --jobs demo-jobs.json --start 2026-10-17T12:00:00 || [ $? -eq 1 ]
